name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # the oldest Python the README promises, and the newest
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.14" }
          - { os: macos-latest, python: "3.14" }
          - { os: windows-latest, python: "3.10" }
          - { os: windows-latest, python: "3.14" }
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      # The scanned-page test needs an OCR engine. macOS has one built in; on Linux
      # and Windows it's tesseract, the same thing a user there would install.
      - name: Install tesseract (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      # Not added to PATH on purpose: the Windows installer often doesn't, so this checks
      # that the scripts find it in its usual install folder anyway.
      - name: Install tesseract (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install tesseract --no-progress -y
          if (Get-Command tesseract -ErrorAction SilentlyContinue) {
            Write-Output "::warning::tesseract is on PATH, so the install-folder lookup isn't being tested"
          } else {
            Write-Output "tesseract is not on PATH; the tests have to find it in its install folder"
          }

      - name: Run the tests
        run: python .claude/skills/use-citations/tests/run.py -v
